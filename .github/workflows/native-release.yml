name: Native releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        default: v1.0.0
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies (allow Wrangler optional peer-version mismatch)
        run: npm ci --legacy-peer-deps
      - name: Generate platform icons
        run: npx --yes @tauri-apps/cli@^2 icon assets/rely-icon.svg
      - name: Build Windows installers
        run: npx --yes @tauri-apps/cli@^2 build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install locked dependencies (allow Wrangler optional peer-version mismatch)
        run: npm ci --legacy-peer-deps
      - name: Generate platform icons
        run: npx --yes @tauri-apps/cli@^2 icon assets/rely-icon.svg
      - name: Build Linux packages
        run: npx --yes @tauri-apps/cli@^2 build --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-native
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies (allow Wrangler optional peer-version mismatch)
        run: npm ci --legacy-peer-deps
      - name: Generate platform icons
        run: npx --yes @tauri-apps/cli@^2 icon assets/rely-icon.svg
      - name: Build macOS disk image
        run: npx --yes @tauri-apps/cli@^2 build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-native
          path: src-tauri/target/release/bundle/dmg/*.dmg

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
      - name: Install Android SDK and NDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Install locked dependencies (allow Wrangler optional peer-version mismatch)
        run: npm ci --legacy-peer-deps
      - name: Generate platform icons
        run: npx --yes @tauri-apps/cli@^2 icon assets/rely-icon.svg
      - name: Initialize Android project
        run: npx --yes @tauri-apps/cli@^2 android init
      - name: Build Android APK
        run: npx --yes @tauri-apps/cli@^2 android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-native
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  publish:
    if: ${{ always() && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' && needs.android.result == 'success' }}
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Normalize release filenames
        run: |
          mkdir -p dist
          find release-assets -type f -name '*.apk' -exec cp {} dist/Rely-Android-debug.apk \;
          find release-assets -type f -name '*.exe' -exec cp {} dist/Rely-Windows-Setup.exe \;
          find release-assets -type f -name '*.AppImage' -exec cp {} dist/Rely-Linux.AppImage \;
          find release-assets -type f -name '*.deb' -exec cp {} dist/Rely-Linux.deb \;
          find release-assets -type f -name '*.dmg' -exec cp {} dist/Rely-macOS.dmg \;
          find release-assets -type f -name '*.ipa' -exec cp {} dist/Rely-iOS.ipa \;
          test -n "$(find dist -type f -print -quit)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Rely ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: true
          files: dist/*
