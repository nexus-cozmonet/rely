name: macOS preview builds

on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "public/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/macos-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install project dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Tauri icons
        run: npx --yes @tauri-apps/cli@^2 icon assets/rely-icon.svg
      - name: Build Apple Silicon DMG
        run: npx --yes @tauri-apps/cli@^2 build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: rely-macos-arm64-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  macos-intel:
    name: Build macOS Intel (x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install project dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Tauri icons
        run: npx --yes @tauri-apps/cli@^2 icon assets/rely-icon.svg
      - name: Build Intel DMG
        run: npx --yes @tauri-apps/cli@^2 build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: rely-macos-intel-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  package-macos-zip:
    name: Package both macOS installers
    needs: [macos-arm64, macos-intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Create combined ZIP
        run: |
          mkdir -p dist
          ARM_DMG="$(find installers/rely-macos-arm64-dmg -type f -name '*.dmg' -print -quit)"
          INTEL_DMG="$(find installers/rely-macos-intel-dmg -type f -name '*.dmg' -print -quit)"
          test -n "$ARM_DMG"
          test -n "$INTEL_DMG"
          cp "$ARM_DMG" dist/Rely-macOS-Apple-Silicon.dmg
          cp "$INTEL_DMG" dist/Rely-macOS-Intel.dmg
          cd dist
          zip -9 Rely-macOS-Installers.zip Rely-macOS-Apple-Silicon.dmg Rely-macOS-Intel.dmg
          shasum -a 256 Rely-macOS-Installers.zip > Rely-macOS-Installers.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Rely-macOS-Installers-ZIP
          path: |
            dist/Rely-macOS-Installers.zip
            dist/Rely-macOS-Installers.zip.sha256
          if-no-files-found: error
          retention-days: 30
